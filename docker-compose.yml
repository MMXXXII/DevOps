
services:
  app:
    image: localhost:5000/my-fastapi-app:${IMAGE_TAG:-latest}
    build: .
    environment:
      DATABASE_URL: sqlite:////data/app.db
    volumes:
      - app_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: localhost:5000/my-fastapi-nginx:${IMAGE_TAG:-latest}
    build: ./nginx
    ports:
      - "8100:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app_data:
