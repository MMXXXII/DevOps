apiVersion: apps/v1
kind: Deployment
metadata:
  name: items
spec:
  replicas: 2
  selector:
    matchLabels:
      app: items
  template:
    metadata:
      labels:
        app: items
    spec:
      containers:
        - name: items
          image: localhost:5000/shop-app:v2
          command: ["uvicorn", "app.items_service:app", "--host", "0.0.0.0", "--port", "8000"]
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            - name: DATABASE_URL
              value: postgresql+psycopg2://shop:$(DB_PASSWORD)@postgres:5432/shop
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /items/count
              port: 8000
          livenessProbe:
            tcpSocket:
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: items
spec:
  selector:
    app: items
  ports:
    - port: 8000
