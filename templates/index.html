<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учет товаров1111</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            color: #222;
        }

        main {
            max-width: 1100px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 25px;
        }

        form {
            border: 1px solid #aaa;
            padding: 20px;
            margin-bottom: 30px;
        }

        .fields {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        label {
            display: block;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            margin-top: 5px;
            padding: 8px;
            border: 1px solid #999;
        }

        button {
            margin-top: 15px;
            margin-right: 5px;
            padding: 8px 12px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #999;
            padding: 8px;
            text-align: left;
        }

        th {
            background: #eee;
        }

        td button {
            margin: 0 4px 0 0;
        }

        #cancel-button {
            display: none;
        }

        #message {
            display: none;
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #999;
        }

        .success {
            background: #e7f5e7;
        }

        .error {
            background: #f9e2e2;
        }

        @media (max-width: 700px) {
            body {
                margin: 15px;
            }

            .fields {
                grid-template-columns: 1fr;
            }

            .table-container {
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>
<main>
    <h1>Учет товаров</h1>

    <div id="message"></div>

    <form id="item-form">
        <h2 id="form-title">Добавить товар</h2>

        <div class="fields">
            <label>
                Название
                <input id="name" type="text" required>
            </label>

            <label>
                Категория
                <input id="category" type="text" required>
            </label>

            <label>
                Цена
                <input id="price" type="number" min="0" step="0.01" required>
            </label>

            <label>
                Количество
                <input id="stock" type="number" min="0" required>
            </label>

            <label>
                Описание
                <input id="description" type="text">
            </label>
        </div>

        <button id="submit-button" type="submit">Добавить</button>
        <button id="cancel-button" type="button">Отмена</button>
    </form>

    <h2>Список товаров</h2>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Название</th>
                    <th>Категория</th>
                    <th>Цена</th>
                    <th>Количество</th>
                    <th>Описание</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="items-table"></tbody>
        </table>
    </div>
</main>

<script>
    let editingId = null;

    const form = document.getElementById("item-form");
    const cancelButton = document.getElementById("cancel-button");

    form.addEventListener("submit", saveItem);
    cancelButton.addEventListener("click", clearForm);

    async function loadItems() {
        try {
            const response = await fetch("/items/");

            if (!response.ok) {
                throw new Error();
            }

            const items = await response.json();
            const table = document.getElementById("items-table");

            if (items.length === 0) {
                table.innerHTML = '<tr><td colspan="7">Товары отсутствуют</td></tr>';
                return;
            }

            table.innerHTML = items.map(item => `
                <tr>
                    <td>${item.id}</td>
                    <td>${escapeHtml(item.name)}</td>
                    <td>${escapeHtml(item.category)}</td>
                    <td>${item.price}</td>
                    <td>${item.stock}</td>
                    <td>${escapeHtml(item.description || "")}</td>
                    <td>
                        <button type="button" onclick="editItem(${item.id})">Изменить</button>
                        <button type="button" onclick="deleteItem(${item.id})">Удалить</button>
                    </td>
                </tr>
            `).join("");
        } catch (error) {
            showMessage("Не удалось загрузить товары", false);
        }
    }

    async function saveItem(event) {
        event.preventDefault();

        const params = new URLSearchParams({
            name: document.getElementById("name").value,
            category: document.getElementById("category").value,
            price: document.getElementById("price").value,
            stock: document.getElementById("stock").value,
            description: document.getElementById("description").value
        });

        const url = editingId === null
            ? `/items/?${params}`
            : `/items/${editingId}?${params}`;

        const method = editingId === null ? "POST" : "PUT";

        try {
            const response = await fetch(url, { method });

            if (!response.ok) {
                const data = await response.json();
                showMessage(data.detail || "Не удалось сохранить товар", false);
                return;
            }

            showMessage(
                editingId === null ? "Товар добавлен" : "Товар изменен",
                true
            );

            clearForm();
            await loadItems();
        } catch (error) {
            showMessage("Ошибка соединения с сервером", false);
        }
    }

    async function editItem(id) {
        try {
            const response = await fetch(`/items/${id}`);

            if (!response.ok) {
                throw new Error();
            }

            const item = await response.json();

            document.getElementById("name").value = item.name;
            document.getElementById("category").value = item.category;
            document.getElementById("price").value = item.price;
            document.getElementById("stock").value = item.stock;
            document.getElementById("description").value = item.description || "";

            editingId = id;
            document.getElementById("form-title").textContent = "Изменить товар";
            document.getElementById("submit-button").textContent = "Сохранить";
            cancelButton.style.display = "inline-block";
            window.scrollTo(0, 0);
        } catch (error) {
            showMessage("Не удалось загрузить товар", false);
        }
    }

    async function deleteItem(id) {
        if (!confirm("Удалить товар?")) {
            return;
        }

        try {
            const response = await fetch(`/items/${id}`, {
                method: "DELETE"
            });

            if (!response.ok) {
                throw new Error();
            }

            showMessage("Товар удален", true);
            await loadItems();
        } catch (error) {
            showMessage("Не удалось удалить товар", false);
        }
    }

    function clearForm() {
        form.reset();
        editingId = null;
        document.getElementById("form-title").textContent = "Добавить товар";
        document.getElementById("submit-button").textContent = "Добавить";
        cancelButton.style.display = "none";
    }

    function showMessage(text, success) {
        const message = document.getElementById("message");
        message.textContent = text;
        message.className = success ? "success" : "error";
        message.style.display = "block";

        setTimeout(() => {
            message.style.display = "none";
        }, 3000);
    }

    function escapeHtml(value) {
        const div = document.createElement("div");
        div.textContent = value;
        return div.innerHTML;
    }

    loadItems();
</script>
</body>
</html>
